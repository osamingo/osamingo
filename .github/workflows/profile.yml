name: Update profile assets

on:
  # 21:00 UTC, which is 06:00 JST.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

# The output branch is replaced wholesale on every run, so only the newest run
# is worth finishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate snake animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_dots=#efefef,#cfd6b3,#b0be78,#91a53c,#718c00&color_snake=#3e999f
            dist/github-snake-dark.svg?color_dots=#282a2e,#4b4f3c,#6f734b,#92985a,#b5bd68&color_snake=#8abeb7

      - name: Trim the canvas
        shell: bash
        run: ./scripts/trim-svg.sh dist/*.svg

      - name: Slow the animation down
        shell: bash
        run: ./scripts/retime-svg.sh dist/*.svg

      - name: Upload generated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-assets
          path: dist
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download generated assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-assets
          path: dist

      - name: Push assets to the output branch
        working-directory: dist
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update profile assets"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
